# Posts one queued story to the Telegram channel every 5 minutes.
# Runs on GitHub's servers - your PC can be completely off.
# The queue is stocked from the PC with:  push_queue.bat
name: Post queued news

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch: {}

concurrency:
  group: post-queue
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL: ${{ secrets.TELEGRAM_FREE_CHANNEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Send the next queued post
        run: python3 scripts/action_send_next.py

      - name: Tweet a top story (X Mode, if due)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 scripts/action_tweet_next.py

      - name: Save the queue cursors
        run: |
          if [ -n "$(git status --porcelain queue/)" ]; then
            git config user.name "india-news-bot"
            git config user.email "india-news-bot@users.noreply.github.com"
            git pull --rebase --autostash
            git add queue/
            git commit -m "queue: advance cursors"
            git push
          else
            echo "State unchanged (queue empty or send failed)."
          fi

      # Self-sustaining chain: after ~5 minutes this run wakes the next one,
      # so posting never depends on GitHub's cron scheduler being on time.
      # The cron trigger stays as a safety net; the throttle in the sender
      # prevents any double posts.
      - name: Keep the 5-minute chain alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 270
          PENDING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post_queue.yml/runs?per_page=50" \
            | jq -r --arg cur "${{ github.run_id }}" \
              '[.workflow_runs[] | select((.status=="in_progress" or .status=="queued") and (.id|tostring)!=$cur)] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "Another run is already pending ($PENDING) - the chain continues there."
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post_queue.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run dispatched - the chain continues."
